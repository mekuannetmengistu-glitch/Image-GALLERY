<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="gallery-container">
        <h1> My best animal Images Gallery</h1>
        
        <!-- Gallery Grid -->
        <div class="gallery-grid">
              <div class="gallery-item"><img src="https://media.istockphoto.com/id/1297006637/photo/young-man-standing-stroking-cow.jpg?s=1024x1024&w=is&k=20&c=di5iCRSv1cfyahMSbyNlGzHkiIhk9UJaTdvHLGb4FM4=" alt="a man with caw"></div>
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1585110396000-c9ffd4e4b308?q=80&w=1374&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="white rabbit"></div>
              <div class="gallery-item"><img src="https://images.unsplash.com/photo-1574068468668-a05a11f871da?q=80&w=327&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="bird"></div>
             <div class="gallery-item"><img src="https://plus.unsplash.com/premium_photo-1669725687221-6fe12c2da6b1?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="lion"></div>
             <div class="gallery-item"><img src="https://images.unsplash.com/photo-1591824438708-ce405f36ba3d?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="tiger"></div>
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1474511320723-9a56873867b5?q=80&w=872&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="fox"></div>
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1529778873920-4da4926a72c2?q=80&w=436&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="cat"></div>
        </div>
    </div>

    
    <div class="lightbox" id="lightbox">
        <span class="close-btn" id="close-btn">&times;</span>
        <button class="nav-btn prev-btn" id="prev-btn">&#10094;</button>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="Popup View">
        </div>
        <button class="nav-btn next-btn" id="next-btn">&#10095;</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
